<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#d99f4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Plateforme Associative" />
    
    <!-- Primary Meta Tags -->
    <title>Plateforme de Gestion Associative</title>
    <meta name="title" content="Plateforme de Gestion Associative" />
    <meta name="description" content="Rejoignez notre association : agenda, répétitions, vestiaire, matériel et espace d'échange." />

    <!-- Open Graph / Facebook / WhatsApp / SMS Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://organizador.o-girador.com/" />
    <meta property="og:site_name" content="Plateforme Associative" />
    <meta property="og:title" content="Plateforme de Gestion Associative" />
    <meta property="og:description" content="Rejoignez notre association : agenda, répétitions, vestiaire, matériel et espace d'échange." />
    <meta property="og:image" content="https://organizador.o-girador.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://organizador.o-girador.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo Association" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://organizador.o-girador.com/" />
    <meta name="twitter:title" content="Plateforme de Gestion Associative" />
    <meta name="twitter:description" content="Rejoignez notre association : agenda, répétitions, vestiaire, matériel et espace d'échange." />
    <meta name="twitter:image" content="https://organizador.o-girador.com/og-image.png" />

    <!-- Icons & Manifest -->
    <link rel="preload" href="/fonts/Cactus%20Regular.otf" as="font" type="font/otf" crossorigin />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/icon-192.png" />
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root">
      <!-- Pré-chargeur statique initial neutre (remplacé automatiquement au montage de React) -->
      <div style="min-height:100vh;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.5rem;background-color:#f4ecd8;color:#181716;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;max-width:20rem;width:100%;">
          <div style="width:6rem;height:6rem;border-radius:9999px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 auto 0.5rem;background:transparent;">
            <img src="/og-girador-frame.svg" alt="O Girador" style="width:100%;height:100%;object-fit:contain;user-select:none;" />
          </div>
          <!-- Spinner stylisé aux couleurs Cordel -->
          <div style="position:relative;width:3rem;height:3rem;">
            <div style="position:absolute;inset:0;border-radius:9999px;border:3px solid rgba(139,42,26,0.15);"></div>
            <div style="position:absolute;inset:0;border-radius:9999px;border:3px solid #8b2a1a;border-right-color:transparent;border-bottom-color:transparent;border-left-color:transparent;animation:og-loader-spin 1s linear infinite;"></div>
          </div>
          <span style="font-weight:900;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.15em;color:#8b2a1a;">
            Chargement...
          </span>
        </div>
      </div>
      <style>
        @keyframes og-loader-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <!-- Filtre SVG Linogravure / Xylogravure pour effet tampon écaillé -->
    <svg width="0" height="0" class="hidden" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;" aria-hidden="true" focusable="false">
      <defs>
        <filter id="lino-filter" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.09" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
