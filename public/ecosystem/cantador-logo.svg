<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Arrière-plan Parchemin et Bordure Terracotta -->
  <defs>
    <!-- Filtre ombrage doux gravure -->
    <filter id="cordel-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.32" />
    </filter>
    <filter id="swirl-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Disque Parchemin d'origine -->
  <circle cx="256" cy="256" r="240" fill="#f4ecd8" filter="url(#cordel-shadow)" />

  <!-- Anneau extérieur Rouge Terracotta (#9a3412) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#9a3412" stroke-width="16" />

  <!-- Filet d'encre intérieur (#1a1a1a) -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#1a1a1a" stroke-width="4" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#c88a2b" stroke-width="2" stroke-dasharray="5 7" opacity="0.8" />

  <!-- Tourbillon de Rubans Courbes (Girador Vortex) -->
  <g filter="url(#swirl-glow)">
    <!-- Ruban 1 : Rouge Terracotta (#9a3412) -->
    <path d="M 256,44 C 362,44 452,126 464,232 C 468,272 448,310 416,334 C 380,360 332,364 290,344 C 238,320 206,270 216,212 C 220,186 236,166 256,156 C 266,151 278,150 286,156 C 294,162 298,174 294,184 C 286,204 266,220 252,240 C 236,262 238,294 256,312 C 278,334 316,336 344,318 C 374,298 390,260 384,224 C 374,152 306,94 234,92 C 196,91 160,105 132,128 C 122,136 108,124 116,114 C 152,70 202,44 256,44 Z" fill="#9a3412" />

    <!-- Ruban 2 : Bleu Ciano (#0f766e) -->
    <path d="M 468,256 C 468,362 386,452 280,464 C 240,468 202,448 178,416 C 152,380 148,332 168,290 C 192,238 242,206 300,216 C 326,220 346,236 356,256 C 361,266 362,278 356,286 C 350,294 338,298 328,294 C 308,286 292,266 272,252 C 250,236 218,238 200,256 C 178,278 176,316 194,344 C 214,374 252,390 288,384 C 360,374 418,306 420,234 C 421,196 407,160 384,132 C 376,122 388,108 398,116 C 442,152 468,202 468,256 Z" fill="#0f766e" />

    <!-- Ruban 3 : Or Ocre (#c88a2b) -->
    <path d="M 256,468 C 150,468 60,386 48,280 C 44,240 64,202 96,178 C 132,152 180,148 222,168 C 274,192 306,242 296,300 C 292,326 276,346 256,356 C 246,361 234,362 226,356 C 218,350 214,338 218,328 C 226,308 246,292 260,272 C 276,250 274,218 256,200 C 234,178 196,176 168,194 C 138,214 122,252 128,288 C 138,360 206,418 278,420 C 316,421 352,407 380,384 C 390,376 404,388 396,398 C 360,442 310,468 256,468 Z" fill="#c88a2b" />

    <!-- Ruban 4 : Noir Encre (#1a1a1a) -->
    <path d="M 44,256 C 44,150 126,60 232,48 C 272,44 310,64 334,96 C 360,132 364,180 344,222 C 320,274 270,306 212,296 C 186,292 166,276 156,256 C 151,246 150,234 156,226 C 162,218 174,214 184,218 C 204,226 220,246 240,260 C 262,276 294,274 312,256 C 334,234 336,196 318,168 C 298,138 260,122 224,128 C 152,138 94,206 92,278 C 91,316 105,352 128,380 C 136,390 124,404 114,396 C 70,360 44,310 44,256 Z" fill="#1a1a1a" />
  </g>

  <!-- Ondes Acoustiques Circulaires Émanantes -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#9a3412" stroke-width="3.5" stroke-dasharray="10 8" opacity="0.9" />
  <circle cx="256" cy="256" r="124" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="14 10" opacity="0.85" />
  <circle cx="256" cy="256" r="136" fill="none" stroke="#c88a2b" stroke-width="2.5" stroke-dasharray="18 12" opacity="0.8" />

  <!-- Médaillon Central Parchemin pour le Microphone -->
  <circle cx="256" cy="256" r="88" fill="#f4ecd8" stroke="#1a1a1a" stroke-width="7" />
  <circle cx="256" cy="256" r="78" fill="#fcf7ec" stroke="#c88a2b" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Microphone Vintage Central Studio Épuré (Gravure Cordel) -->
  <g id="vintage-mic">
    <!-- Arche / Étrier pivotant (Swivel mount) -->
    <path d="M 218,236 C 218,278 234,300 256,300 C 278,300 294,278 294,236" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round" />
    
    <!-- Molettes latérales de serrage de l'étrier -->
    <circle cx="218" cy="236" r="6" fill="#9a3412" stroke="#1a1a1a" stroke-width="3" />
    <circle cx="294" cy="236" r="6" fill="#9a3412" stroke="#1a1a1a" stroke-width="3" />

    <!-- Tige centrale verticale -->
    <rect x="252" y="300" width="8" height="24" fill="#1a1a1a" />

    <!-- Socle circulaire biseauté (Pied vintage) -->
    <ellipse cx="256" cy="326" rx="38" ry="11" fill="#1a1a1a" />
    <ellipse cx="256" cy="324" rx="32" ry="7" fill="#c88a2b" opacity="0.8" />
    <ellipse cx="256" cy="323" rx="26" ry="4.5" fill="#f4ecd8" />

    <!-- Capsule / Corps principal du micro (Pill-shape studio) -->
    <!-- Fond capsule -->
    <rect x="234" y="184" width="44" height="74" rx="22" fill="#1a1a1a" />

    <!-- Bague centrale cuivrée de séparation -->
    <rect x="232" y="220" width="48" height="6" rx="2" fill="#c88a2b" stroke="#1a1a1a" stroke-width="1.5" />

    <!-- Grille acoustique supérieure (Fentes gravées en parchemin) -->
    <line x1="242" y1="194" x2="270" y2="194" stroke="#f4ecd8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="239" y1="200" x2="273" y2="200" stroke="#f4ecd8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="238" y1="206" x2="274" y2="206" stroke="#f4ecd8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="238" y1="212" x2="274" y2="212" stroke="#f4ecd8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Corps inférieur avec accent Terracotta et Ciano -->
    <rect x="240" y="231" width="32" height="18" rx="4" fill="#9a3412" stroke="#1a1a1a" stroke-width="1" />
    <circle cx="256" cy="240" r="3.5" fill="#0f766e" />
  </g>
</svg>